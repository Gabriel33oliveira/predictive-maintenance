[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "predmaint"
version = "0.1.0"
description = "Synthetic sensor simulation, anomaly detection, RUL estimation and maintenance prioritization for rotating equipment."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "jinja2",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
predmaint = "predmaint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
